# Pull requests to main. A high production advisory fails this check. Gray Beard does not merge a PR with a red audit.
# deploy-release.yml runs the same `npm test` gate only on a versioned production deploy.
name: Production dependency audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Build first: the built-HTML test (src/how-it-works.test.ts) fails under CI=true without .next output.
      - name: Install deps, build, and audit gate
        run: npm ci --no-audit && npm run build && npm test
