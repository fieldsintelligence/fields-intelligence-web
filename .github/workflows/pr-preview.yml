# Preview deploys for pull requests to main (#32). Previews are built here, never
# from a local clone. Plain `pull_request` (never the _target variant): fork PRs get
# no secrets; the deploy step is skipped for them. This workflow never uses --prod.
name: Preview deploy

on:
  pull_request:
    branches:
      - main

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install deps and audit gate
        run: npm ci --no-audit && npm test

      - name: Install Vercel CLI
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: npm install --global vercel@62.4.0

      - name: Deploy preview to Vercel
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(VERCEL_ORG_ID=team_m5ApD0j2P01y0kiswd9aGVjD VERCEL_PROJECT_ID=prj_aunxZgkQhfy9xL4ddL8xJbeAMd6r vercel deploy --scope fieldsintelligence --token "$VERCEL_TOKEN")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Preview deployment URL: ${url}"
          echo "Preview deployment for ${GITHUB_SHA}: ${url}" >> "$GITHUB_STEP_SUMMARY"
