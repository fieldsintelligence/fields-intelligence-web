# Production deploys only. Branch pushes and pull requests do not run this workflow.
# Trigger: a pushed v*.*.* tag. Publishing a Release also pushes its tag, so the
# tag push alone deploys once (a release trigger made a second deploy of the same tag).
# workflow_dispatch: run by hand on a v*.*.* tag ref only; any other ref is skipped.
name: Deploy production release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  Deploy-Production:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Require semver tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::${tag} is not a version tag (expected vX.Y.Z). Production deploy aborted."
            exit 1
          fi
          echo "Deploying production from ${tag}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      # Build first: the built-HTML test (src/how-it-works.test.ts) fails under CI=true without .next output.
      - name: Install deps, build, and audit gate
        run: npm ci --no-audit && npm run build && npm test

      - name: Install Vercel CLI
        run: npm install --global vercel@62.4.0

      # Org and project IDs are set on this command only, with --scope, so the
      # CLI deploys the existing project. Vercel builds remotely.
      - name: Deploy to Vercel production
        id: deploy
        run: |
          url="$(VERCEL_ORG_ID=${{ secrets.VERCEL_ORG_ID }} VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID }} vercel deploy --prod --yes --scope fieldsintelligence --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Production deployment URL: ${url}"
