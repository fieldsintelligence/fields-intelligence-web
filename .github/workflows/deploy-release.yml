# Production deploys only. Branch pushes and pull requests do not run this workflow.
# `gh release create vX.Y.Z --target <SHA>` publishes the release; that single
# event is the only trigger, so each tag deploys to production exactly once (#32).
name: Deploy production release

on:
  release:
    types: [published]

concurrency:
  group: vercel-production-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Require semver tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::${tag} is not a version tag (expected vX.Y.Z). Production deploy aborted."
            exit 1
          fi
          echo "Deploying production from ${tag}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install deps and audit gate
        run: npm ci --no-audit && npm test

      - name: Install Vercel CLI
        run: npm install --global vercel@62.4.0

      # Org and project IDs are set on the command line only (never exported), and
      # Vercel builds remotely with the project's production settings, so no
      # `vercel pull` or `vercel link` is needed. .vercelignore keeps .env* out.
      - name: Deploy to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(VERCEL_ORG_ID=team_m5ApD0j2P01y0kiswd9aGVjD VERCEL_PROJECT_ID=prj_aunxZgkQhfy9xL4ddL8xJbeAMd6r vercel deploy --prod --yes --scope fieldsintelligence --token "$VERCEL_TOKEN")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Production deployment URL: ${url}"
          echo "Production deployment (${GITHUB_REF_NAME}): ${url}" >> "$GITHUB_STEP_SUMMARY"
