# Production deploys only. Branch pushes and pull requests do not run this workflow.
# A GitHub Release that creates a new tag can emit both events; concurrency
# serializes those runs so they do not deploy in parallel.
name: Deploy production release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: vercel-production-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Require semver tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::${tag} is not a version tag (expected vX.Y.Z). Production deploy aborted."
            exit 1
          fi
          echo "Deploying production from ${tag}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Production deployment URL: ${url}"
