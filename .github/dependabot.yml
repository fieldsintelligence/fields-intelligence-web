version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: production
    open-pull-requests-limit: 5
    # react-dom peers the matching react release, and React refuses to run
    # when the installed versions differ. A split bump fails CI on its own.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
